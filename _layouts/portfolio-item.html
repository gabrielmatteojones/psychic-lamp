---
layout: default
---
<article class="article">
  <header class="page-head">
    <div class="wrap narrow">
      <p class="eyebrow"><span class="chip on">{{ page.area }}</span></p>
      <h1 class="big reveal">{{ page.title }}</h1>
      <p class="lead reveal">{{ page.description }}</p>
    </div>
  </header>
  <div class="wrap narrow">
    {% if page.image %}<img class="cover reveal" src="{{ page.image | relative_url }}" alt="{{ page.title }}">{% endif %}
    <div class="prose reveal">{{ content }}</div>
    {% if page.link and page.link != "" %}<a class="btn btn-yellow" href="{{ page.link }}" target="_blank" rel="noopener">Vai al progetto</a>{% endif %}
    <a class="btn btn-dark" href="{{ '/portfolio/' | relative_url }}">← Portfolio</a>
  </div>
</article>
